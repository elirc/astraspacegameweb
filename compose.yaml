services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: warband
      POSTGRES_PASSWORD: warband_local
      POSTGRES_DB: warband
    ports: ['127.0.0.1:55432:5432']
    volumes: ['warband_pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U warband']
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:56379:6379']
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['warband_redis:/data']
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:51025:1025', '127.0.0.1:58025:8025']
volumes:
  warband_pg:
  warband_redis:
