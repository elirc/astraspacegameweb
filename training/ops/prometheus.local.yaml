# Training copy of infra/prometheus.yaml for processes running on the host.
# Port plan used by training/ops/RUNBOOK-LOCAL.md:
#   3001 ROLE=api   3002-3004 ROLE=resolver   3005 ROLE=relay   3006 ROLE=sidejobs
# Down targets are expected when you run fewer roles; `up == 0` is itself a signal.
# NODE_ENV is not production locally, so /metrics needs no bearer token.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yaml
  - /etc/prometheus/slo-rules.yaml
scrape_configs:
  - job_name: warband
    static_configs:
      - targets: ['host.docker.internal:3001']
        labels: { role: api }
      - targets: ['host.docker.internal:3002', 'host.docker.internal:3003', 'host.docker.internal:3004']
        labels: { role: resolver }
      - targets: ['host.docker.internal:3005']
        labels: { role: relay }
      - targets: ['host.docker.internal:3006']
        labels: { role: sidejobs }
